<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yayo42 | Dijital Portföy</title>
    <style>
        /* --- GENEL AYARLAR --- */
        :root {
            --primary: #3b82f6; /* Neon Mavi */
            --secondary: #8b5cf6; /* Neon Mor */
            --bg-color: #0f172a; /* Çok koyu lacivert (Siyah değil) */
            --text-color: #cbd5e1;
            --card-bg: rgba(30, 41, 59, 0.7); /* Buzlu Cam */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* --- ANİMASYONLAR --- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
            50% { text-shadow: 0 0 20px rgba(139, 92, 246, 0.8); }
            100% { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        }

        /* Animasyon sınıfları */
        .animate-1 { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; }
        .animate-2 { animation: fadeInUp 0.8s ease-out 0.2s forwards; opacity: 0; }
        .animate-3 { animation: fadeInUp 0.8s ease-out 0.4s forwards; opacity: 0; }
        .animate-4 { animation: fadeInUp 0.8s ease-out 0.6s forwards; opacity: 0; }

        /* --- YAPI --- */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            margin-bottom: 80px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- HERO (GİRİŞ) --- */
        .hero {
            text-align: center;
            padding: 60px 0;
            margin-bottom: 100px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .gradient-text {
            background: linear-gradient(to right, var(--primary), #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: glow 3s infinite alternate;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            color: #94a3b8;
        }

        /* --- KARTLAR --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 100px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px); /* Arka planı bulanıklaştırır */
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px); /* Hoverda yukarı kalkar */
            border-color: var(--primary);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.3);
        }

        .card h3 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .card h3::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--primary);
        }

        /* --- PROJELER BÖLÜMÜ --- */
        .projects {
            margin-bottom: 100px;
        }

        .projects h2 {
            font-size: 2.5rem;
            color: #fff;
